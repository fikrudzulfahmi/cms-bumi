name: Deploy Frontend (cPanel)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: SSH key + Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          echo "::warning title=KEY INFO::len=${#RAW} baris=$(printf '%s' "$RAW" | wc -l) md5=$(printf '%s' "$RAW" | md5sum | cut -d' ' -f1)"
          echo "::warning title=KEY LINES::[$(printf '%s' "$RAW" | awk '{printf "%d ", length($0)}')]"
          echo "::warning title=SECRET LAIN::HOST=[${SSH_HOST:-KOSONG}] USER=[${SSH_USER:-KOSONG}] PATH=[${DEPLOY_PATH:-KOSONG}] api=[${{ secrets.VITE_API_BASE_URL }}]"

          try_key() { printf '%s\n' "$1" > /tmp/kt; chmod 600 /tmp/kt; ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; }
          OK=0; FMT=""

          if try_key "$RAW"; then cp /tmp/kt ~/.ssh/deploy_key; OK=1; FMT="as-is"; fi
          if [ "$OK" = 0 ]; then
            echo "::error title=TRY-1 as-is GAGAL::$(ssh-keygen -y -f /tmp/kt 2>&1 >/dev/null | tr '\n' ' ')"
          fi

          if [ "$OK" = 0 ]; then
            if printf '%s' "$RAW" | tr -d '\n\r ' | base64 -d > /tmp/kd 2>/dev/null && try_key "$(cat /tmp/kd)"; then
              cp /tmp/kd ~/.ssh/deploy_key; OK=1; FMT="base64(file)"; fi
          fi
          if [ "$OK" = 0 ]; then
            CLEAN=$(printf '%s' "$RAW" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//g' -e 's/-----END OPENSSH PRIVATE KEY-----//g' | tr -d ' \t\n\r')
            { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s\n' "$CLEAN" | fold -w 70; echo "-----END OPENSSH PRIVATE KEY-----"; } > /tmp/kr
            printf '\n' >> /tmp/kr
            if try_key "$(cat /tmp/kr)"; then cp /tmp/kr ~/.ssh/deploy_key; OK=1; FMT="rebuild"; fi
          fi

          if [ "$OK" = 0 ]; then
            echo "::error title=SSH_KEY RUSAK::Tidak ada format yang valid. Cek md5 di atas vs file server."
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          echo "::notice title=SSH_KEY OK::format=$FMT | sidik jari pubkey=$(ssh-keygen -y -f ~/.ssh/deploy_key | md5sum | cut -c1-12)"

          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "whoami && hostname" 2>&1); then
            echo "::notice title=SSH TERHUBUNG::$(printf '%s' "$OUT" | tr '\n' ' ')"
          else
            echo "::error title=SSH GAGAL::$(printf '%s' "$OUT" | tr '\n' '|')"
            exit 1
          fi

          tar czf /tmp/deploy.tgz -C dist .
          if ! scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes /tmp/deploy.tgz "$SSH_USER@$SSH_HOST:~/cms_bumi_upload.tgz" 2>&1; then
            echo "::error title=SCP GAGAL::upload terputus"; exit 1
          fi
          if OUT2=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH' && tar xzf ~/cms_bumi_upload.tgz -C '$DEPLOY_PATH' && rm -f ~/cms_bumi_upload.tgz && ls -la '$DEPLOY_PATH' | head -12" 2>&1); then
            echo "::notice title=DEPLOY FRONTEND OK::$(printf '%s' "$OUT2" | tr '\n' '|')"
          else
            echo "::error title=DEPLOY GAGAL::$(printf '%s' "$OUT2" | tr '\n' '|')"
            exit 1
          fi
