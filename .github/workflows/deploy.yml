name: Deploy Frontend (cPanel)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy ke cPanel (SSH/SCP)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"

          echo "================= DIAGNOSTIK SECRET ================="
          echo "SSH_HOST   = [$SSH_HOST]"
          echo "SSH_USER   = [$SSH_USER]"
          echo "SSH_PORT   = [$PORT]"
          echo "DEPLOY_PATH= [$DEPLOY_PATH]"
          echo "SSH_KEY    : panjang=${#SSH_KEY} huruf, baris=$(printf '%s' "$SSH_KEY" | wc -l)"
          echo "SSH_KEY    : awal -> $(printf '%s' "$SSH_KEY" | head -c 40)"
          echo "====================================================="

          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          printf '\n' >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "================= TES KONEKSI SSH ================="
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "echo TERHUBUNG sebagai \$(whoami) di \$(hostname)"
          echo "==================================================="

          echo "================= UPLOAD & EKSTRAK ================="
          tar czf /tmp/deploy.tgz -C dist .
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=no \
            /tmp/deploy.tgz "$SSH_USER@$SSH_HOST:~/cms_bumi_upload.tgz"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH' && tar xzf ~/cms_bumi_upload.tgz -C '$DEPLOY_PATH' && rm -f ~/cms_bumi_upload.tgz && echo '--- isi docroot ---' && ls -la '$DEPLOY_PATH' | head -15"
          echo "===================== SELESAI ====================="
